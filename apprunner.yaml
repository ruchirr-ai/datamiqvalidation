version: 1.0
runtime: python3
build:
  commands:
    pre-build:
      - echo "Installing dependencies..."
      - cd backend
      - pip install --upgrade pip
      - pip install -r requirements.txt
    build:
      - echo "Running database migrations..."
      - alembic upgrade head
    post-build:
      - echo "Build completed successfully"
run:
  command: cd backend && uvicorn main:app --host 0.0.0.0 --port 8080
  network:
    port: 8080
    env: APP_PORT
  env:
    - name: APP_PORT
      value: "8080"
    - name: PYTHONUNBUFFERED
      value: "1"
    - name: APP_DB_HOST
      value: "34.226.150.199"
    - name: APP_DB_PORT
      value: "5432"
    - name: APP_DB_NAME
      value: "datamiq"
    - name: APP_DB_USER
      value: "datamig"
    - name: APP_DB_PASSWORD
      value: "datamig"
    - name: JWT_SECRET_KEY
      value: "change_me_in_production_use_long_random_string"
    - name: REDIS_HOST
      value: "34.226.150.199"
    - name: REDIS_PORT
      value: "6379"
    - name: REDIS_ENABLED
      value: "true"
    - name: ADMIN_USER
      value: "admin"
    - name: ADMIN_PASSWORD
      value: "AdminPass123!"
    - name: CORS_ORIGINS
      value: "*"
