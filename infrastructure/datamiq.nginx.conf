# DataMIQ nginx site config
# Install:
#   sudo cp infrastructure/datamiq.nginx.conf /etc/nginx/sites-available/datamiq
#   sudo ln -sf /etc/nginx/sites-available/datamiq /etc/nginx/sites-enabled/datamiq
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo chmod o+x /home/ubuntu          # let nginx traverse into the home dir
#   sudo nginx -t && sudo systemctl restart nginx
#
# After adding a domain + TLS, run `sudo certbot --nginx -d yourdomain.com`
# (certbot edits this file automatically to add the 443 server block).

server {
    listen 80;
    server_name _;   # replace with yourdomain.com once DNS is set

    # Built Vite frontend (static files)
    root /home/ubuntu/datamiq/frontend/dist;
    index index.html;

    client_max_body_size 100M;   # allow file uploads

    # SPA routing: serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API -> FastAPI backend on localhost:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Validations / migrations can run long — generous timeouts
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        access_log off;
    }
}
